<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple DOM Manipulation Assignment Demo</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <h1 id="main-heading">Welcome to My Page</h1>
  </header>

  <main>
    <section>
      <p id="intro-text">This is a basic demo showing DOM manipulation with JavaScript.</p>
      <button id="change-text-btn">Change Text</button>
    </section>

    <section>
      <div id="color-box">Click below to change my color!</div>
      <button id="change-color-btn">Change Color</button>
    </section>

    <section>
      <button id="toggle-element-btn">Add/Remove Element</button>
      <div id="toggle-target-area"></div>
    </section>
  </main>

  <footer>
    <p>Created with 💙 using HTML & JavaScript</p>
  </footer>
</body>
</html>
